name: Desktop builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to embed in package, Tauri and Cargo metadata
        required: true
        default: 0.1.0
      channel:
        description: Signed update channel
        required: true
        type: choice
        options: [stable, beta]
        default: stable
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: cutline-windows
            platform: windows-x86_64
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-14
            artifact: cutline-macos-apple-silicon
            platform: macos-aarch64
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Synchronize release version
        id: release-version
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: node release/set-version.mjs
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run release gate checks
        run: pnpm check
      - name: Prepare Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNER_SUBJECT: ${{ vars.CUTLINE_UPDATE_SIGNER_SUBJECT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { throw 'WINDOWS_CERTIFICATE secret is required' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'WINDOWS_CERTIFICATE_PASSWORD secret is required' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNER_SUBJECT)) { throw 'CUTLINE_UPDATE_SIGNER_SUBJECT variable is required' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'cutline-authenticode.pfx'
          $encodedCertificate = $env:WINDOWS_CERTIFICATE `
            -replace '-----BEGIN CERTIFICATE-----', '' `
            -replace '-----END CERTIFICATE-----', '' `
            -replace '\s', ''
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($encodedCertificate))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $signingCertificate = $imported | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $signingCertificate) { throw 'Imported PFX does not contain a private signing key' }
          if ($signingCertificate.Subject -ne $env:WINDOWS_SIGNER_SUBJECT) { throw "Certificate subject does not match CUTLINE_UPDATE_SIGNER_SUBJECT: $($signingCertificate.Subject)" }
          $signingConfigPath = Join-Path $env:RUNNER_TEMP 'tauri.windows.signing.json'
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $signingCertificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'https://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $signingConfigPath -Encoding utf8
          "CUTLINE_TAURI_CONFIG=$signingConfigPath" >> $env:GITHUB_ENV
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE" || { echo 'APPLE_CERTIFICATE secret is required' >&2; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo 'APPLE_CERTIFICATE_PASSWORD secret is required' >&2; exit 1; }
          test -n "$KEYCHAIN_PASSWORD" || { echo 'APPLE_KEYCHAIN_PASSWORD secret is required' >&2; exit 1; }
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" cutline.keychain
          security default-keychain -s cutline.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" cutline.keychain
          security set-keychain-settings -t 3600 -u cutline.keychain
          security import certificate.p12 -k cutline.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" cutline.keychain
          security find-identity -v -p codesigning cutline.keychain
      - name: Validate Apple notarization credentials
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          test -n "$APPLE_ID" || { echo 'APPLE_ID secret is required' >&2; exit 1; }
          test -n "$APPLE_PASSWORD" || { echo 'APPLE_APP_PASSWORD secret is required' >&2; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo 'APPLE_TEAM_ID secret is required' >&2; exit 1; }
          test -n "$APPLE_SIGNING_IDENTITY" || { echo 'APPLE_SIGNING_IDENTITY secret is required' >&2; exit 1; }
      - name: Build desktop bundles
        run: node release/build-desktop.mjs
        env:
          CUTLINE_RELEASE_PLATFORM: ${{ matrix.platform }}
          CUTLINE_RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
          CUTLINE_UPDATE_ORIGIN: ${{ vars.CUTLINE_UPDATE_ORIGIN }}
          CUTLINE_UPDATE_PUBLIC_KEY: ${{ vars.CUTLINE_UPDATE_PUBLIC_KEY }}
          CUTLINE_UPDATE_KEY_ID: ${{ vars.CUTLINE_UPDATE_KEY_ID }}
          CUTLINE_UPDATE_SIGNER_SUBJECT: ${{ vars.CUTLINE_UPDATE_SIGNER_SUBJECT }}
          CUTLINE_UPDATE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_CUTLINE_CRASH_ENDPOINT: ${{ vars.CUTLINE_CRASH_ENDPOINT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNER_SUBJECT: ${{ vars.CUTLINE_UPDATE_SIGNER_SUBJECT }}
        run: |
          $targets = @(
            'src-tauri/target/release/cutline.exe'
            'src-tauri/target/release/bundle/msi/*.msi'
            'src-tauri/target/release/bundle/nsis/*.exe'
          ) | ForEach-Object { Get-Item $_ }
          if ($targets.Count -ne 3) { throw "Expected signed EXE, MSI and NSIS artifacts; found $($targets.Count)" }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($target.FullName) ($($signature.Status))" }
            if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_SIGNER_SUBJECT) { throw "Unexpected signer: $($signature.SignerCertificate.Subject)" }
          }
      - name: Verify macOS signature and notarization ticket
        if: runner.os == 'macOS'
        run: |
          app_path=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path" || { echo 'macOS app bundle not found' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
