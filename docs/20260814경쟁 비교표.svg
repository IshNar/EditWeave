<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">2026년 8월 EditWeave 경쟁 비교 요약표</title>
  <desc id="desc">Premiere, DaVinci Resolve, Final Cut Pro, CapCut과 EditWeave의 현재 상태 및 집중 목표를 비교한 표. EditWeave HDR은 PQ·HLG Main10 원본 보존과 효과 합성 설치본 출력 검증, Creator Pack 생태계는 자동 검증 단계다.</desc>
