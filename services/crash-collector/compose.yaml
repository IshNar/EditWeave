services:
  collector:
    build:
      context: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      EDITWEAVE_CRASH_HOST: 0.0.0.0
      EDITWEAVE_CRASH_PORT: 8787
      EDITWEAVE_CRASH_DATA_DIR: /data
      EDITWEAVE_CRASH_RETENTION_DAYS: ${EDITWEAVE_CRASH_RETENTION_DAYS:-30}
      EDITWEAVE_CRASH_MAX_STORAGE_MB: ${EDITWEAVE_CRASH_MAX_STORAGE_MB:-512}
      EDITWEAVE_CRASH_MAX_BODY_KB: ${EDITWEAVE_CRASH_MAX_BODY_KB:-32}
      EDITWEAVE_CRASH_RATE_LIMIT_PER_MINUTE: ${EDITWEAVE_CRASH_RATE_LIMIT_PER_MINUTE:-60}
      EDITWEAVE_CRASH_ALLOWED_ORIGINS: ${EDITWEAVE_CRASH_ALLOWED_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost}
      EDITWEAVE_CRASH_TRUST_PROXY: 1
    volumes:
      - crash_data:/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - collector
    environment:
      EDITWEAVE_CRASH_DOMAIN: ${EDITWEAVE_CRASH_DOMAIN:?Set EDITWEAVE_CRASH_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private
    security_opt:
      - no-new-privileges:true

networks:
  private:

volumes:
  crash_data:
  caddy_data:
  caddy_config:
