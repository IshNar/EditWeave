services:
  creator-pack-server:
    build:
      context: ../..
      dockerfile: services/creator-pack-server/Dockerfile
    restart: unless-stopped
    environment:
      EDITWEAVE_CREATOR_PACK_HOST: 0.0.0.0
      EDITWEAVE_CREATOR_PACK_CHANNEL_DIR: /channel
      EDITWEAVE_CREATOR_PACK_PUBLIC_ORIGIN: https://${EDITWEAVE_CREATOR_PACK_DOMAIN:?Set EDITWEAVE_CREATOR_PACK_DOMAIN in .env}
      EDITWEAVE_CREATOR_PACK_PUBLIC_KEY: ${EDITWEAVE_CREATOR_PACK_PUBLIC_KEY:?Set EDITWEAVE_CREATOR_PACK_PUBLIC_KEY in .env}
      EDITWEAVE_CREATOR_PACK_KEY_ID: ${EDITWEAVE_CREATOR_PACK_KEY_ID:?Set EDITWEAVE_CREATOR_PACK_KEY_ID in .env}
      EDITWEAVE_CREATOR_PACK_ALLOWED_ORIGINS: ${EDITWEAVE_CREATOR_PACK_ALLOWED_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost}
      EDITWEAVE_CREATOR_PACK_MAX_ACTIVE_DOWNLOADS: ${EDITWEAVE_CREATOR_PACK_MAX_ACTIVE_DOWNLOADS:-100}
      EDITWEAVE_CREATOR_PACK_MAX_DOWNLOADS_PER_IP: ${EDITWEAVE_CREATOR_PACK_MAX_DOWNLOADS_PER_IP:-8}
    volumes:
      - ../../release/creator-pack-channel:/channel:ro
    networks: [creator-packs]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [creator-pack-server]
    environment:
      EDITWEAVE_CREATOR_PACK_DOMAIN: ${EDITWEAVE_CREATOR_PACK_DOMAIN:?Set EDITWEAVE_CREATOR_PACK_DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [creator-packs]
    security_opt: [no-new-privileges:true]
networks:
  creator-packs: {}
volumes:
  caddy_data: {}
  caddy_config: {}
